basePath: /
definitions:
  articles.ArticleBody:
    properties:
      'text:':
        type: string
      title:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.Articles:
    properties:
      comments:
        items:
          $ref: '#/definitions/models.Comments'
        type: array
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      isRemoved:
        $ref: '#/definitions/sql.NullBool'
      text:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  models.Comments:
    properties:
      articleId:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      isRemoved:
        $ref: '#/definitions/sql.NullBool'
      text:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  sql.NullBool:
    properties:
      bool:
        type: boolean
      valid:
        description: Valid is true if Bool is not NULL
        type: boolean
