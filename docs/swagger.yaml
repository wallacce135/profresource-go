host: localhost:4000
info:
  contact: {}
  title: Profresource go Application
  version: "1.0"
paths:
  /articles:
    get:
      consumes:
      - application/json
      description: Get all articles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Articles'
            type: array
        "401":
          description: Unauthorized
          schema: {}
      summary: Get all articles
      tags:
      - Articles
  /articles/:id:
    delete:
      consumes:
      - application/json
      description: Delete one article with provided ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Article deleted successfully
          schema:
            type: string
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Article not found
          schema:
            type: string
        "500":
          description: You unable to delete this article!
          schema:
            type: string
      summary: Delete one article with provided ID from database
      tags:
      - Article
    get:
      consumes:
      - application/json
      description: Get one article with provided ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Articles'
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Article not found
          schema:
            type: string
      summary: Get one article with provided ID
      tags:
      - Article
    put:
      consumes:
      - application/json
      description: Update information about an article
      parameters:
      - description: Body information for article update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/articles.ArticleBody'
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Articles'
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Article not found
          schema:
            type: string
      summary: Update information about an article
      tags:
      - Article
  /articles/create:
    post:
      consumes:
      - application/json
      description: Creating a new article
      parameters:
      - description: Body information for article creation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/articles.ArticleBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Articles'
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Article not found
          schema:
            type: string
      summary: Creating a new article
      tags:
      - Article
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
